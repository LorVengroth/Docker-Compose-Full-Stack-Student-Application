services:
  postgres-db:
    image: postgres:16-alpine
    container_name: student-postgres
    restart: always
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - student-network

  backend:
    build:
      context: ./student-api
      dockerfile: Dockerfile
    container_name: student-backend
    restart: always
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      SERVER_PORT: 8081
    depends_on:
      - postgres-db
    ports:
      - "8081:8081"
    networks:
      - student-network

  frontend:
    build:
      context: ./student-ui
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - student-network

volumes:
  pgdata:

networks:
  student-network:
    driver: bridge